[build]
  # Na Netlify trafia strona na telefon (web/, Vite + Vue) — budowana do web/dist,
  # oraz funkcja wysyłająca powiadomienia na telefon (netlify/functions/push.mjs → /api/push).
  command = "npm run build:web"
  publish = "web/dist"

[build.environment]
  # Netlify instaluje zależności z package.json — sam Electron nie jest tu potrzebny.
  ELECTRON_SKIP_BINARY_DOWNLOAD = "1"

[functions]
  directory = "netlify/functions"

# Adresy podstron aplikacji (/kalendarz, /wydarzenie/<id>…) — ta sama strona; widok wybiera aplikacja.
[[redirects]]
  from = "/kalendarz"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/kalendarz-google"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/wydarzenie/*"
  to = "/index.html"
  status = 200

