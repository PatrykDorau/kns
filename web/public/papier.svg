<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
  <!-- Pognieciony kremowy papier z plamami kawy (jak na grafikach ogłoszeń). -->
  <defs>
    <filter id="crumple" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .018" numOctaves="4" seed="11" result="n"/>
      <feDiffuseLighting in="n" surfaceScale="3.2" lighting-color="#fbf6ee" result="l"><feDistantLight azimuth="225" elevation="52"/></feDiffuseLighting>
      <feComposite in="l" in2="SourceGraphic" operator="arithmetic" k1="1.05" k2="0" k3="0" k4="0"/>
    </filter>
    <filter id="fiber" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="3"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .45  0 0 0 0 .33  0 0 0 0 .22  0 0 0 .07 0"/>
    </filter>
    <filter id="stain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="3" seed="5" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="18"/>
      <feGaussianBlur stdDeviation=".6"/>
    </filter>
    <radialGradient id="wash" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#b07a4a" stop-opacity=".1"/><stop offset=".85" stop-color="#9b6338" stop-opacity=".16"/><stop offset="1" stop-color="#7a4a26" stop-opacity=".0"/></radialGradient>
  </defs>
  <rect width="600" height="400" fill="#efe5d6"/>
  <rect width="600" height="400" fill="#efe5d6" filter="url(#crumple)"/>
  <rect width="600" height="400" filter="url(#fiber)"/>
  <!-- plamy kawy: rozlana plama i ślady filiżanki -->
  <g filter="url(#stain)">
    <ellipse cx="520" cy="70" rx="120" ry="95" fill="url(#wash)"/>
    <circle cx="505" cy="300" r="58" fill="none" stroke="#9a6236" stroke-opacity=".28" stroke-width="5"/>
    <circle cx="505" cy="300" r="55" fill="none" stroke="#9a6236" stroke-opacity=".12" stroke-width="2"/>
    <circle cx="70" cy="350" r="44" fill="none" stroke="#9a6236" stroke-opacity=".18" stroke-width="4"/>
    <ellipse cx="455" cy="150" rx="14" ry="9" fill="#9a6236" fill-opacity=".15"/>
    <ellipse cx="575" cy="190" rx="7" ry="5" fill="#9a6236" fill-opacity=".18"/>
  </g>
</svg>
