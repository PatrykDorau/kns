<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Napisy pieśni — Kościół Na Skale</title>
<!-- Napisy pieśni na przezroczystym tle dla OBS (źródło „Przeglądarka”, 1920×1080), przez internet:
     aplikacja rzutnika (na dowolnym komputerze i w dowolnej sieci) nadaje bieżącą zwrotkę kanałem na żywo bazy
     (bez zapisu w bazie), a ta strona ją pokazuje. Adres z kluczem: /napisy?k=KLUCZ — klucz jest w ustawieniach
     aplikacji rzutnika. Parametry: pozycja=dol|srodek|gora, rozmiar=6 (wysokość liter w % ekranu), pasek=1, cien=0. -->
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: var(--v, flex-end); padding: 4vh 5vw 7vh; box-sizing: border-box; }
  #t { max-width: 90vw; color: #fff; font: 700 var(--s, 6vh)/1.25 "Segoe UI", system-ui, sans-serif; text-align: center; white-space: pre-line;
    text-shadow: 0 0 .12em rgba(0, 0, 0, .9), 0 .05em .3em rgba(0, 0, 0, .85), 0 .1em .6em rgba(0, 0, 0, .6); transition: opacity .35s; opacity: 0; }
  #t.flat { text-shadow: none; }
  #t.bar { background: rgba(0, 0, 0, .55); padding: .25em .6em; border-radius: .25em; }
  #t.on { opacity: 1; }
  #help { display: none; max-width: 560px; margin: auto; padding: 20px 24px; border-radius: 14px; background: #17181c; color: #f3f3f6; font: 16px/1.5 system-ui, sans-serif; }
  #help b { color: #f2a53c; }
</style>
</head>
<body>
<div id="t"></div>
<div id="help">
  <p><b>Napisy pieśni dla OBS</b></p>
  <p>W aplikacji rzutnika: Ustawienia aplikacji → „Napisy pieśni dla OBS” → „Przez internet”. Skopiuj stamtąd adres (z kluczem) i wklej go w OBS jako źródło „Przeglądarka” (1920×1080).</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  const q = new URLSearchParams(location.search), t = document.getElementById('t')
  const key = (q.get('k') || '').replace(/[^\w-]/g, '')
  document.body.style.setProperty('--v', { gora: 'flex-start', srodek: 'center' }[q.get('pozycja')] || 'flex-end')
  document.body.style.setProperty('--s', (parseFloat(q.get('rozmiar')) || 6) + 'vh')
  if (q.get('pasek') === '1') t.classList.add('bar')
  if (q.get('cien') === '0') t.classList.add('flat')
  let last = null
  function set(text) {
    text = String(text || '')
    if (text === last) return
    last = text
    t.classList.remove('on')
    setTimeout(() => { t.textContent = text; if (text) t.classList.add('on') }, text && t.textContent ? 200 : 0)
  }
  if (!key) document.getElementById('help').style.display = 'block'
  else {
    const sb = supabase.createClient('https://igkjlgdpvgdeqfqctnnf.supabase.co', 'sb_publishable_Ji4v_zRY2OGsMRAWwiis-g_x6WAYCPI', { auth: { persistSession: false } })
    const ch = sb.channel('napisy-' + key, { config: { broadcast: { self: false } } })
    ch.on('broadcast', { event: 'napisy' }, ({ payload }) => set(payload?.text))
    // Po połączeniu prosimy rzutnik o bieżącą zwrotkę (nie trzeba czekać na zmianę slajdu).
    ch.subscribe(status => { if (status === 'SUBSCRIBED') ch.send({ type: 'broadcast', event: 'hello', payload: {} }) })
  }
</script>
</body>
</html>
